version: '3.8'

services:
  pragmatic-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      # AWS Bedrock
      - AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      # Google AI API (Gemini)
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Google Cloud Vision API
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      # Moonshot AI
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY}
      # Ollama (if running separately)
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
    volumes:
      # Mount .env file (if exists)
      - ./.env:/app/.env:ro
      # Mount GCP credentials (if using file path)
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./credentials.json}:/app/credentials.json:ro
      # Persist databases
      - ./data:/app/backend/cognitive_architecture/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Ollama service (if not running locally)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    profiles:
      - ollama

volumes:
  ollama_data:
